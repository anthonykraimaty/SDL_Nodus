# ===========================================
# NODUS - Full Stack Application
# ===========================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose build --no-cache   # Rebuild after code changes
#   docker compose logs -f            # View all logs
#   docker compose logs -f backend    # View backend logs
#   docker compose logs -f postgres   # View database logs

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nodus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaftaaa}
      POSTGRES_DB: ${POSTGRES_DB:-nodus_db}
    # Uncomment to expose PostgreSQL externally (not recommended for production)
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nodus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodus_user} -d ${POSTGRES_DB:-nodus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodus_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5020}:3001"
    # Everything in backend/.env is passed to the container. The image never
    # contains it (.dockerignore excludes .env), so without this line the
    # Keycloak settings would silently not reach the app and sign-in would
    # stay on email + password.
    #
    # `environment:` below still wins over env_file, so DATABASE_URL keeps
    # pointing at the compose network rather than whatever a developer has in
    # backend/.env for their laptop.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nodus_user}:${POSTGRES_PASSWORD:-kaftaaa}@postgres:5432/${POSTGRES_DB:-nodus_db}?schema=public
      PORT: 3001
      NODE_ENV: production
      # CLIENT_URL / JWT_SECRET / JWT_EXPIRES_IN deliberately come from
      # backend/.env via env_file above. Re-declaring them here would override
      # it — and the old JWT_SECRET default was a public placeholder from this
      # repo, which would have replaced the real secret and invalidated every
      # session token the moment the container restarted.
      B2_ENDPOINT: ${B2_ENDPOINT}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
      B2_PUBLIC_URL: ${B2_PUBLIC_URL}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - nodus_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nodus_network:
    name: nodus_network
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
